name: Refresh dashboard data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, after the US market closes
  workflow_dispatch:
  push:
    branches: [claude/project-thread-e4lb48]
    paths:
      - scripts/build_dashboard_data.py
      - src/wikiquant/pageviews.py
      - .github/workflows/dashboard-data.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance requests
      - run: python scripts/build_dashboard_data.py
      - name: Commit fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push
